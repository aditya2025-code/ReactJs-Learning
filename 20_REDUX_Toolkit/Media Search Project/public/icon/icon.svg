<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MediaSearch app icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1a7a"/>
      <stop offset="1" stop-color="#1c6fd1"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000" opacity=".22"/>
    </pattern>
  </defs>

  <!-- desktop tile -->
  <rect width="512" height="512" rx="96" fill="#0e6b6b"/>
  <rect width="512" height="512" rx="96" fill="url(#dots)"/>

  <g shape-rendering="crispEdges">
    <!-- window hard shadow -->
    <rect x="72" y="88" width="392" height="352" fill="#111"/>
    <!-- window -->
    <rect x="56" y="72" width="392" height="352" fill="#d4d0c8" stroke="#111" stroke-width="8"/>
    <rect x="64" y="80" width="376" height="336" fill="none" stroke="#fff" stroke-width="4"/>

    <!-- title bar -->
    <rect x="68" y="84" width="368" height="48" fill="url(#tb)"/>
    <rect x="92" y="100" width="88" height="16" fill="#fff" opacity=".9"/>
    <rect x="352" y="98" width="20" height="20" fill="#d4d0c8" stroke="#111" stroke-width="3"/>
    <rect x="380" y="98" width="20" height="20" fill="#d4d0c8" stroke="#111" stroke-width="3"/>
    <rect x="408" y="98" width="20" height="20" fill="#d4d0c8" stroke="#111" stroke-width="3"/>

    <!-- picture well (bevel in) -->
    <rect x="88" y="152" width="336" height="240" fill="#404040"/>
    <rect x="92" y="156" width="332" height="236" fill="#fff"/>
    <rect x="92" y="156" width="328" height="232" fill="#8fd3ff"/>

    <!-- sun -->
    <rect x="336" y="176" width="48" height="48" fill="#ffd400" stroke="#111" stroke-width="6"/>
    <!-- far hills, stepped -->
    <polygon points="92,320 92,300 132,300 132,276 172,276 172,252 212,252 212,276 252,276 252,300 292,300 292,320 388,320 388,388 92,388" fill="#1c6fd1" stroke="#111" stroke-width="6" stroke-linejoin="miter"/>
    <!-- near hills -->
    <polygon points="92,388 92,348 148,348 148,324 204,324 204,348 244,348 244,372 300,372 300,388" fill="#0a1a7a" stroke="#111" stroke-width="6"/>
  </g>

  <!-- magnifier -->
  <g>
    <!-- handle shadow + handle -->
    <line x1="352" y1="352" x2="440" y2="440" stroke="#111" stroke-width="44" stroke-linecap="square"/>
    <line x1="352" y1="352" x2="440" y2="440" stroke="#ffd400" stroke-width="28" stroke-linecap="square"/>
    <!-- lens shadow -->
    <circle cx="300" cy="300" r="76" fill="none" stroke="#111" stroke-width="14" transform="translate(10 10)"/>
    <!-- lens -->
    <circle cx="300" cy="300" r="76" fill="#eafaff" fill-opacity=".55" stroke="#111" stroke-width="14"/>
    <circle cx="300" cy="300" r="62" fill="none" stroke="#fff" stroke-width="6"/>
    <!-- glint -->
    <path d="M262 286 A44 44 0 0 1 292 258" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="square"/>
  </g>
</svg>
